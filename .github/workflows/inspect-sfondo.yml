name: Inspect JPG dimensions
on:
  push:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read JPG metadata
        run: |
          file loghi_sfondi/sfondo_cli_marrone.jpg
          identify -format 'WIDTH=%w HEIGHT=%h ASPECT=%[fx:w/h]\n' loghi_sfondi/sfondo_cli_marrone.jpg