name: Deploy Studio Legale Silella

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.git' ./ _site/
          cat > _site/config.js <<EOF
          window.STUDIO_SUPABASE_URL = 'https://dkeqicstprvvfebiaooc.supabase.co';
          window.STUDIO_SUPABASE_PUBLISHABLE_KEY = '${SUPABASE_PUBLISHABLE_KEY}';
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          injection = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="studio-dashboard.js"></script>'
          if injection not in s:
              s = s.replace(marker, injection + marker)
          p.write_text(s, encoding='utf-8')
          c = Path('_site/cliente.html')
          if c.exists():
              c.write_text(c.read_text(encoding='utf-8').replace('</script></script>', '</script>'), encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
