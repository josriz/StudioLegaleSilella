<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Registrazione nuovo cliente dello Studio Legale Silella.">
<title>Studio Legale Silella | Registrazione Cliente</title>
<style>
:root{--navy:#0c1730;--gold:#c7a15a;--gold2:#e4c985;--danger:#ffe4e6;--muted:#d7dfeb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,rgba(8,18,36,.62),rgba(15,23,42,.34)),url('loghi_sfondi/stanza_vetro.jpg') center/cover fixed no-repeat;color:#fff}
.authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.authCard{width:min(440px,100%);padding:24px 30px 18px;border:1px solid rgba(255,255,255,.58);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.10));box-shadow:0 28px 80px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)}
.logo{display:flex;justify-content:center;align-items:center;margin:0 0 14px;width:100%;height:78px;border:1px solid rgba(255,255,255,.42);border-radius:18px;background:rgba(255,255,255,.12);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:fill;display:block;filter:drop-shadow(0 5px 12px rgba(0,0,0,.22))}
.kicker{text-align:center;font-size:10px;font-weight:800;letter-spacing:.22em;color:rgba(255,255,255,.78);margin-bottom:4px}
h1{margin:0;text-align:center;font:600 26px Georgia,serif;text-shadow:0 2px 12px rgba(0,0,0,.28)}
.subtitle{margin:5px 0 16px;text-align:center;color:rgba(255,255,255,.84);font-size:12.5px;line-height:1.45}
form{display:grid;gap:9px}
label{color:rgba(255,255,255,.92);font-size:12px;font-weight:700}
input{width:100%;padding:10px 13px;border:1px solid rgba(255,255,255,.48);border-radius:12px;outline:none;background:rgba(255,255,255,.82);color:#0f172a;font-size:14px}
input:focus{background:rgba(255,255,255,.96);border-color:rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.check{display:flex;gap:9px;align-items:flex-start;color:rgba(255,255,255,.84);font-size:12px;line-height:1.5;font-weight:400}
.check input{width:auto;margin-top:3px}
.status{color:rgba(255,255,255,.82);font-size:12px;line-height:1.5;text-align:center}
.err{min-height:18px;color:var(--danger);font-size:12px;line-height:1.4}
.btn{width:100%;padding:11px 16px;border:1px solid rgba(255,255,255,.58);border-radius:12px;cursor:pointer;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.16));box-shadow:0 10px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.42)}
.btn.gold{background:linear-gradient(135deg,rgba(228,201,133,.85),rgba(199,161,90,.72));color:#0c1730}
.btn.outline{margin-top:12px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.38)}
.footer{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);text-align:center;color:rgba(255,255,255,.68);font-size:9px;letter-spacing:.03em}
@media(max-width:600px){.authWrap{padding:12px}.authCard{padding:20px 17px 15px;border-radius:20px}.logo{height:68px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="authWrap">
  <section class="authCard">
    <div class="logo"><img src="Logo_Studio_Silella.jpg" alt="Studio Legale Silella" onerror="this.src='Logo_Studio_Silella.webp'"></div>
    <div class="kicker">AREA CLIENTE</div>
    <h1>Crea il tuo accesso</h1>
    <p class="subtitle">Registrati per accedere al portale dello Studio Legale Silella.</p>
    <form id="signupForm">
      <label for="customerType">Tipologia cliente</label><select id="customerType" required><option value="persona_fisica">Persona fisica</option><option value="azienda">Azienda / professionista</option></select>\n      <label for="signupName">Nome e cognome</label>
      <input id="signupName" type="text" autocomplete="name" required placeholder="Nome e cognome">
      <label for="signupEmail">Email</label>
      <input id="signupEmail" type="email" autocomplete="email" required placeholder="La tua email">
      <label for="signupPassword">Password</label>
      <input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Almeno 8 caratteri">
      <label class="check"><input id="privacyConsent" type="checkbox" required><span>Dichiaro di aver preso visione dell’informativa privacy vigente dello Studio.</span></label>
      <div id="privacySignupInfo" class="status">Caricamento informativa privacy vigente…</div>
      <label class="check"><input id="termsConsent" type="checkbox" required><span>Accetto i Termini di utilizzo del portale.</span></label>
      <div id="signupErr" class="err"></div>
      <button class="btn gold" id="signupBtn" type="submit">Crea accesso cliente</button>
    </form>
    <button class="btn outline" id="showLogin" type="button" onclick="location.href='cliente.html'">Ho già un accesso</button>
    <div class="footer">Accesso riservato ai Clienti autorizzati</div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const STUDIO_SUPABASE_URL='https://dscinvstqizfxwrovsbb.supabase.co';
const STUDIO_SUPABASE_PUBLISHABLE_KEY='sb_publishable_aVF8u7kXdbznCYQakC3NqQ_fJQkBZQ9';
const sb=supabase.createClient(STUDIO_SUPABASE_URL,STUDIO_SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'silella-client-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let activePrivacyNotice=null;
async function loadPrivacy(){
  const today=new Date().toISOString().slice(0,10);
  const {data,error}=await sb.from('studio_privacy_informative').select('id,titolo,versione,contenuto,valida_dal,valida_al').eq('tipo','clienti').eq('stato','attiva').or('valida_dal.is.null,valida_dal.lte.'+today).or('valida_al.is.null,valida_al.gte.'+today).order('valida_dal',{ascending:false}).limit(1).maybeSingle();
  if(error){console.error('Informativa privacy:',error);return}
  activePrivacyNotice=data||null;
  const el=$('privacySignupInfo');
  if(el)el.textContent=activePrivacyNotice?'Informativa privacy vigente disponibile.':'Informativa privacy vigente non disponibile: registrazione temporaneamente sospesa.';
}
$('signupForm').onsubmit=async e=>{
  e.preventDefault();$('signupErr').textContent='';$('signupBtn').disabled=true;
  try{
    const name=$('signupName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value;
    if(!activePrivacyNotice)throw Error('L’informativa privacy vigente non è disponibile. Registrazione non disponibile.');
    if(password.length<8)throw Error('La password deve contenere almeno 8 caratteri.');
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
    if(error)throw error;
    localStorage.setItem('studio_portal_consents_v1',JSON.stringify({privacy:!!$('privacyConsent').checked,terms:!!$('termsConsent').checked}));
    if(data.session){
      const {error:bootError}=await sb.rpc('studio_bootstrap_cliente');
      if(bootError)throw bootError;
      const {data:userData}=await sb.auth.getUser();
      if(userData?.user)await sb.from('studio_clienti').update({full_name:name}).eq('user_id',userData.user.id);
      location.replace('cliente-portale.html');
    }else{
      $('signupErr').textContent='Account creato. Controlla la posta, conferma l’email e poi accedi all’Area Cliente.';
    }
  }catch(err){$('signupErr').textContent=err.message}
  finally{$('signupBtn').disabled=false}
};
loadPrivacy();
</script>
</body>
</html>
